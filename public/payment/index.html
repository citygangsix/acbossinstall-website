    <meta name="description" content="Review and authorize a Same Day Appliances invoice before secure Square payment." />

    <script type="module" crossorigin src="/payment/assets/index-Qp3XCNim.js"></script>
    <link rel="stylesheet" crossorigin href="/payment/assets/index-0AIZ0e04.css" />
  </head>
  <body>
    <script>
      (function () {
        var redirect = sessionStorage.getItem("asap-payment-spa-redirect");
        if (!redirect) return;
        sessionStorage.removeItem("asap-payment-spa-redirect");
        var url = new URL(redirect, window.location.origin);
        if (url.origin === window.location.origin && url.pathname.indexOf("/payment/") === 0) {
          history.replaceState(null, "", url.pathname + url.search + url.hash);
        }
      })();
    </script>
    <div id="root"></div>
  </body>
