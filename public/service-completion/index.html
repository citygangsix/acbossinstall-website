  <body>
    <script>
      (function () {
        var redirect = sessionStorage.getItem("asap-service-completion-spa-redirect");
        if (!redirect) return;
        sessionStorage.removeItem("asap-service-completion-spa-redirect");
        var url = new URL(redirect, window.location.origin);
        if (url.origin === window.location.origin && url.pathname.indexOf("/service-completion/") === 0) {
          history.replaceState(null, "", url.pathname + url.search + url.hash);
        }
      })();
    </script>
